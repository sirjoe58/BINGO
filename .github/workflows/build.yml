name: Build BINGO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: v1.0.${{ github.run_number }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepara:
    runs-on: ubuntu-latest
    steps:
      - name: Crea la Release
        run: |
          gh release create "$TAG" --title "BINGO 1.0.${{ github.run_number }}" --target "${{ github.sha }}" --notes "BINGO / Tombola
          - Windows: BINGO-Setup (con installazione) oppure BINGO-Portatile (senza installazione)
          - Mac: BINGO-Mac.dmg"

  windows:
    needs: prepara
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx electron-builder --win --publish never
      - name: Carica nella Release
        shell: bash
        run: gh release upload "$TAG" dist/*.exe --clobber

  mac:
    needs: prepara
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Carica nella Release
        run: gh release upload "$TAG" dist/*.dmg --clobber

  pulizia:
    needs: [ windows, mac ]
    runs-on: ubuntu-latest
    steps:
      - name: Tieni solo le ultime 2 versioni
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' | while read t; do
            echo "Cancello $t"; gh release delete "$t" --yes --cleanup-tag || true
          done
